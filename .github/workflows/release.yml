name: Release

# Pushing a tag like v0.1.0 builds hermit on every platform and publishes a
# GitHub Release with the archives. "Run workflow" from the Actions tab does the
# same builds without publishing, to try the pipeline.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64,  runner: macos-15 }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: linux-x86_64, runner: ubuntu-22.04 }
          - { platform: linux-arm64,  runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            # Every place the version is written must agree with the tag.
            declared="$(python -c 'import runpy; print(runpy.run_path("cli/_version.py")["__version__"])')"
            cmake_version="$(sed -n 's/^project(hermit VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
            libhbc_version="$(sed -n 's/^version = "\([0-9.]*\)".*/\1/p' pyproject.toml)"
            hermit_version="$(sed -n 's/^version = "\([0-9.]*\)".*/\1/p' packaging/pypi/hermit/pyproject.toml)"
            libhbc_pin="$(sed -n 's/.*"libhbc==\([0-9.]*\)".*/\1/p' packaging/pypi/hermit/pyproject.toml)"
            for pair in "cli/_version.py:$declared" "CMakeLists.txt:$cmake_version" \
                        "pyproject.toml:$libhbc_version" "hermit/pyproject.toml:$hermit_version" \
                        "libhbc== pin:$libhbc_pin"; do
              if [[ "${pair#*:}" != "$version" ]]; then
                echo "::error::tag v$version disagrees with ${pair%%:*} (${pair#*:})"; exit 1
              fi
            done
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"

      - name: Build
        run: packaging/build-release.sh "${{ steps.version.outputs.version }}" "${{ matrix.platform }}"

      - name: Smoke test
        shell: bash
        run: |
          set -o pipefail
          app="dist/hermit-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          # Test the archive, not the build tree.
          mkdir smoke && tar -xzf "$app.tar.gz" -C smoke
          smoke/hermit-*-${{ matrix.platform }}/hermit --version
          printf 'info\nexit\n' | smoke/hermit-*-${{ matrix.platform }}/hermit tests/fixtures/hello.hbc | tee repl.out
          grep -q "HBC v96" repl.out

      - name: Debian package
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update && sudo apt-get install -y nfpm
          version="${{ steps.version.outputs.version }}"
          case "${{ matrix.platform }}" in
            linux-x86_64) arch=amd64 ;;
            linux-arm64)  arch=arm64 ;;
          esac
          export VERSION="$version" ARCH="$arch" APPDIR="dist/hermit-$version-${{ matrix.platform }}"
          deb="dist/hermit_${version}_${arch}.deb"
          # nfpm expands env vars only in top-level scalar fields, not in
          # contents.src globs, so render the config ourselves first.
          command -v envsubst >/dev/null || sudo apt-get install -y gettext-base
          envsubst '${VERSION} ${ARCH} ${APPDIR}' < packaging/nfpm.yaml > dist/nfpm.rendered.yaml
          nfpm pkg -f dist/nfpm.rendered.yaml -p deb -t "$deb"
          if command -v sha256sum >/dev/null; then sha256sum "$deb"; else shasum -a 256 "$deb"; fi > "$deb.sha256"
          # Smoke-test the .deb in a clean container.
          docker run --rm -v "$PWD/dist:/d" ubuntu:22.04 bash -c \
            "apt-get update -qq && apt-get install -y /d/$(basename "$deb") && hermit --version"

      - uses: actions/upload-artifact@v4
        with:
          name: hermit-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: hermit-*
          merge-multiple: true

      - name: Checksums
        run: cd assets && cat *.sha256 > SHA256SUMS && rm *.sha256 && cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Prebuilt `hermit` for macOS and Linux (arm64 and x86_64).

          Easiest install: `pipx install hermit-hbc` (any platform), `brew install xV4L3x/hermit/hermit`
          (macOS/Linuxbrew), or on Debian/Ubuntu `sudo apt install ./hermit_<version>_<arch>.deb`.
          The archives below are the no-package-manager fallback.

          - `hermit-<version>-<platform>.tar.gz`: the interactive REPL. Unpack it and run `./hermit file.hbc`.
          - `hermit_<version>_<arch>.deb`: Debian/Ubuntu package (installs `/usr/bin/hermit`).
          - `SHA256SUMS`: checksums of every archive (`shasum -a 256 -c SHA256SUMS`).

          On macOS the binaries are not signed: after downloading, run
          `xattr -dr com.apple.quarantine <unpacked folder>` before the first launch.
          The Linux builds need glibc 2.35 or newer.
          NOTES
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --title "hermit ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --generate-notes --verify-tag
